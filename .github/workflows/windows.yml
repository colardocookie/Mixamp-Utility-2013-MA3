name: Windows launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline app safety tests
        run: npm test
      - name: Launcher tests
        run: python -m unittest discover -s launcher-tests -v
      - name: Install build tool
        run: python -m pip install pyinstaller==6.22.3
      - name: Build portable executable
        run: python tools/build_windows.py
      - name: Test packaged executable without hardware
        run: python tools/smoke_launcher.py dist/MixAmp-Utility.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MixAmp-Utility-Windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MixAmp-Utility-Windows-x64
          path: dist
      - name: Attach executable and notices to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
